stages: [lint, test, deploy]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NEXTEST_VERSION: "0.9.140"
  CARGO_DENY_VERSION: "0.20.2"

.rust:
  image: rust:1.99-bookworm
  interruptible: true
  cache:
    key:
      files: [Cargo.lock]
      prefix: $CI_JOB_NAME
    paths: [.cargo/registry, .cargo/git, .cargo/bin, target]
  before_script:
    - mkdir -p "$CARGO_HOME/bin"
    - export PATH="$CARGO_HOME/bin:$PATH"

fmt:
  extends: .rust
  stage: lint
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

clippy:
  extends: .rust
  stage: lint
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

check:
  extends: .rust
  stage: lint
  script:
    - cargo check --workspace --all-targets --all-features --locked

docs:
  extends: .rust
  stage: lint
  variables:
    RUSTDOCFLAGS: "-D warnings"
  script:
    - cargo doc --workspace --no-deps --all-features --locked

deny-policy:
  extends: .rust
  stage: lint
  script:
    - |
      case "$(uname -m)" in
        aarch64|arm64) DENY_TARGET=aarch64-unknown-linux-musl ;;
        *)             DENY_TARGET=x86_64-unknown-linux-musl ;;
      esac
    - |
      if ! (cargo deny --version 2>/dev/null | grep -q "$CARGO_DENY_VERSION"); then
        echo "Installing cargo-deny v$CARGO_DENY_VERSION ($DENY_TARGET)..."
        curl -LsSf "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-${DENY_TARGET}.tar.gz" \
          | tar xzf - --strip-components=1 -C "$CARGO_HOME/bin" "cargo-deny-${CARGO_DENY_VERSION}-${DENY_TARGET}/cargo-deny" \
          || cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      fi
    - cargo deny check bans licenses sources

