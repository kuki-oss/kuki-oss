mirror-to-github:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/kuki-oss/kuki-oss.git"
    - git fetch origin "+refs/heads/*:refs/remotes/origin/*" --tags
    - git push github --prune "+refs/remotes/origin/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
