graphql-contract:
  extends: .rust
  stage: test
  variables:
    RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends lld
    - cargo test -p kuki-api --test graphql_contract
  rules:
    - changes:
        paths: ["api/**/*", "crates/api/**/*", "crates/store/**/*"]
        compare_to: refs/heads/master

openapi-lint:
  stage: lint
  image: node:22
  interruptible: true
  script:
    - cd api/schema && npx --yes @redocly/cli lint openapi.yaml
  rules:
    - changes:
        paths: ["api/**/*", "redocly.yaml"]
        compare_to: refs/heads/master

schemathesis:
  stage: test
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: openapi-lint
      optional: true
  when: manual
  allow_failure: true
  script:
    - apk add --no-cache bash curl py3-pip
    - ./deploy/docker/scripts/dev-up.sh
    - KUKI_KEY=$(./deploy/docker/scripts/mint-dev-key.sh | tail -n1)
    - pip install --break-system-packages "schemathesis==4.*"
    - |
      schemathesis run api/schema/openapi.yaml \
        --url http://docker:8080 \
        -H "Authorization: Bearer $KUKI_KEY" \
        --max-examples 25

test:
  extends: .rust
  stage: test
  services:
    - name: postgres:18
      alias: postgres
      command: ["postgres", "-c", "fsync=off", "-c", "max_connections=300"]
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
    RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends lld
    - |
      case "$(uname -m)" in
        aarch64|arm64) NEXTEST_PLATFORM=linux-arm ;;
        *)             NEXTEST_PLATFORM=linux ;;
      esac
    - curl -LsSf "https://get.nexte.st/$NEXTEST_VERSION/$NEXTEST_PLATFORM" | tar xzf - -C "$CARGO_HOME/bin"
    - cargo nextest run --workspace --all-features --locked --profile ci
    - cargo test --workspace --all-features --locked --doc
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      junit: target/nextest/ci/junit.xml

mirror-to-github:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  resource_group: github-mirror
  interruptible: false
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG
  script:
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/kuki-oss/kuki-oss.git"
    - git fetch origin "+refs/heads/*:refs/remotes/origin/*" --tags
    - git push github --prune "+refs/remotes/origin/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
