[workspace]
members = [
    "backend/libraries/common",
    "backend/services/api_service",
    "backend/services/ingestion_worker",
    "backend/services/kuki_engine",
]
resolver = "2"

[workspace.dependencies]
common = { path = "backend/libraries/common" }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "bigdecimal",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1.0.102"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.13.3", features = ["json"] }
aws-config = "1.8.16"
aws-sdk-s3 = "1.132.0"
bigdecimal = { version = "0.4", features = ["serde-json"] }
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto", "use_pem"] }
rand = { version = "0.10.1", features = ["std"] }
hex = "0.4.3"
sha2 = "0.11.0"
rustls = { version = "0.23.40", features = ["ring"] }
async-graphql = { version = "7", features = ["dataloader", "bigdecimal", "uuid", "chrono"] }
async-graphql-axum = "7.2.1"
base64 = "0.22.1"
csv = "1"
surrealdb = { version = "3.2.4", features = ["protocol-ws"] }
