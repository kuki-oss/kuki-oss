name: kuki

# Shared by every long-running role (one image, one subcommand each).
# `kuki` itself adds `build:` and does not use pull_policy so it builds the image the others reuse.
x-kuki-app: &kuki-app
  restart: unless-stopped
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  secrets: [database_url, bao_token]
  depends_on:
    kafka: { condition: service_healthy }
    openbao: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

x-kuki-env: &kuki-env
  KUKI_DATABASE_URL_FILE: /run/secrets/database_url
  KUKI_BAO_ADDR: http://openbao:8200
  KUKI_BAO_TOKEN_FILE: /run/secrets/bao_token
  KUKI_KEY_ENV: ${KUKI_KEY_ENV:-live}
  KUKI_KAFKA_BROKERS: kafka:19092
  RUST_LOG: ${RUST_LOG:-info}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: kuki
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${KUKI_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kuki"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # DEV ONLY: dev mode is in-memory and auto-unsealed. Restarting it loses the
  # Transit key, which invalidates every API key. Use real storage in production use-cases.
  openbao:
    image: ${OPENBAO_IMAGE:-openbao/openbao:latest}
    restart: unless-stopped
    command: ["server", "-dev"]
    cap_add: [IPC_LOCK]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_ROOT_TOKEN:?run scripts/dev-up.sh first}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: kuki-oss:dev
    pull_policy: never
    command: ["migrate"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      KUKI_MIGRATE_DATABASE_URL_FILE: /run/secrets/database_url
      RUST_LOG: ${RUST_LOG:-info}
    secrets: [database_url]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Operator CLI (`kuki keys ...`, `kuki orgs ...`, `kuki webhooks ...`).
  # Not started by `up`; run this with
  #   docker compose run --rm -T admin keys list
  admin:
    image: kuki-oss:dev
    pull_policy: never
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      KUKI_MIGRATE_DATABASE_URL_FILE: /run/secrets/database_url
      KUKI_BAO_ADDR: http://openbao:8200
      KUKI_BAO_TOKEN_FILE: /run/secrets/bao_token
      KUKI_KEY_ENV: ${KUKI_KEY_ENV:-live}
      RUST_LOG: ${RUST_LOG:-warn}
    secrets: [database_url, bao_token]
    depends_on:
      postgres: { condition: service_healthy }
      openbao: { condition: service_healthy }
    restart: "no"

  # The Kuki API: GraphQL, REST ingest, live subscriptions (needs Kafka for those).
  kuki:
    <<: *kuki-app
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: kuki-oss:dev
    command: ["serve"]
    environment:
      <<: *kuki-env
      KUKI_BIND: 0.0.0.0:8080
      KUKI_RATE_LIMIT_BURST: ${KUKI_RATE_LIMIT_BURST:-200}
      KUKI_RATE_LIMIT_REFILL_PER_SECOND: ${KUKI_RATE_LIMIT_REFILL_PER_SECOND:-100}
    ports:
      - "127.0.0.1:${KUKI_PORT:-8080}:8080"

  # Relays the Postgres-backed outbox into Kafka (this is leader-elected, extra replicas are safe).
  outbox:
    <<: *kuki-app
    image: kuki-oss:dev
    pull_policy: never
    command: ["outbox"]
    environment: *kuki-env

  # Re-evaluates the generators when the ontology changes.
  evaluate:
    <<: *kuki-app
    image: kuki-oss:dev
    pull_policy: never
    command: ["evaluate", "run"]
    environment: *kuki-env

  # Executes approved actions and delivers queued webhook events.
  actions:
    <<: *kuki-app
    image: kuki-oss:dev
    pull_policy: never
    command: ["actions", "run"]
    environment:
      <<: *kuki-env
      # Dev receivers are plain http. Keep this off in production use-cases.
      KUKI_WEBHOOK_ALLOW_HTTP: ${KUKI_WEBHOOK_ALLOW_HTTP:-false}

  # Consumes recommendation events from Kafka and queues them for webhook subscribers.
  webhooks-fanout:
    <<: *kuki-app
    image: kuki-oss:dev
    pull_policy: never
    command: ["webhooks", "fanout"]
    environment: *kuki-env

secrets:
  pg_password: { file: ./secrets/pg_password }
  database_url: { file: ./secrets/database_url }
  bao_token: { file: ./secrets/bao_token }

volumes:
  pgdata: {}
